name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:builds

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the Dev app for the iOS simulator
        working-directory: apps/mobile
        env:
          POLSO_APP_VARIANT: development
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
          xcodebuild -workspace PolsoDev.xcworkspace -scheme PolsoDev -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  # The one status branch protection requires: every job above must pass.
  check:
    needs: [verify, ios-simulator]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          IOS_RESULT: ${{ needs.ios-simulator.result }}
        run: |
          if [ "$VERIFY_RESULT" = success ] && [ "$IOS_RESULT" = success ]; then exit 0; fi
          echo "Verify: $VERIFY_RESULT. iOS simulator: $IOS_RESULT."
          exit 1
